    <script>
        (function () {
            var scheme, contrast;
            try {
                scheme = localStorage.getItem('flo-scheme');
                contrast = localStorage.getItem('flo-contrast');
            } catch (e) {}
            var mq = function (q) { return window.matchMedia && window.matchMedia(q).matches; };
            if (scheme !== 'light' && scheme !== 'dark') scheme = mq('(prefers-color-scheme: dark)') ? 'dark' : 'light';
            contrast = contrast === 'true' || (contrast !== 'false' && mq('(prefers-contrast: more)'));
            document.documentElement.dataset.theme = scheme === 'dark' ? 'dark' : contrast ? 'contrast' : 'afternoon';
        })();
    </script>
</head>
